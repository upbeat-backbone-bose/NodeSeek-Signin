name: diag attendance probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodeseek-diag
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NS_COOKIE: ${{ secrets.NS_COOKIE }}
      NS_RANDOM: ${{ secrets.NS_RANDOM }}

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置Python环境
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 探针
        run: python .github/workflows/diag_probe.py
