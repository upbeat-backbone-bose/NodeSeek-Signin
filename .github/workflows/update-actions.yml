name: Verify Pinned Actions

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require SHA-pinned actions
        shell: bash
        run: |
          set -euo pipefail
          # 任何 uses: 引用都必须以 40 位十六进制 commit SHA 结尾。
          rc=0
          grep -RInE 'uses:[[:space:]]+[^[:space:]]+@[^[:space:]]+' .github > /tmp/uses.txt || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::无法扫描 .github（grep 退出码 $rc）。"
            exit 1
          fi
          if grep -vE '@[0-9a-f]{40}([[:space:]]|$)' /tmp/uses.txt; then
            echo "::error::GitHub Actions 必须固定到完整 commit SHA，请使用 Dependabot 更新。"
            exit 1
          fi
          echo "所有 GitHub Actions 均已固定到 commit SHA。"
