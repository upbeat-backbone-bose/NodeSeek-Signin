name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      docker_tags:
        description: 'Docker 镜像标签（多个用逗号分隔）'
        required: false
        default: 'test'
        type: string
      push_image:
        description: '是否推送到远程仓库'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - 'docker-test/**'
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '*.py'

env:
  REGISTRY: ${{ vars.DOCKERHUB_REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/nodeseek-signin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        if: github.event_name == 'release' || github.event_name == 'push' || github.event.inputs.push_image == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=test,enable=${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.docker_tags == 'test') }}
            type=raw,value=${{ github.event.inputs.docker_tags }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.docker_tags != '' && github.event.inputs.docker_tags != 'test' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # docker-test/** 分支推送同样会发布 test 标签镜像，
          # 否则该触发器只会构建而不推送，等于没有实际作用。
          push: ${{ github.event_name == 'release' || github.event_name == 'push' || github.event.inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 生成 SBOM 与 provenance，便于追溯供应链
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
